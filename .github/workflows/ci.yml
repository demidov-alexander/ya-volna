name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        # The suite never needs a Yandex account or network access.
        run: pytest --cov=yavolna --cov-report=term-missing

      - name: Offline end-to-end smoke test
        run: yavolna --provider fake generate --dry-run --seed 1 --duration-hours 6

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ya-volna -f docker/Dockerfile .
      - name: Run offline smoke test in the image
        run: docker run --rm ya-volna --provider fake generate --dry-run --duration-hours 2
